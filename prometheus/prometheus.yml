global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Connect Prometheus to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Load alerting rules
rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Prometheus monitoring itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090", "localhost:9090"]
        labels:
          app: "prometheus"

  # Docker container metrics via cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          app: "cadvisor"

  # Flask monitoring application
  - job_name: "monitoring-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["monitoring-app:5000", "monitoring-container:5000"]
        labels:
          app: "monitoring-app"

  # Prometheus Alertmanager
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          app: "alertmanager"
